<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Micumán</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Micumán">
<meta name="theme-color" content="#2B1E2F">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --cerro:#C4552D;--tierra:#8C3B22;--rosa:#D98B7E;--puerta:#3E5B45;--puerta2:#2D4533;--madera:#6B4A2F;
  --noche:#2B1E2F;--magenta:#D6246E;--maiz:#F2B705;--azul:#2F5FA7;--adobe:#F3E6D3;--cal:#FBF6EE;--arcilla:#E8D2B8;
  --muted:#6B5A55;--ink2:#4A3A40;--line:#D9C3A8;
  --serif:Alegreya,Georgia,serif;--sans:'Alegreya Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--adobe);color:var(--noche);font-family:var(--sans);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:110px}
.agy{background:repeating-linear-gradient(90deg,#D6246E 0 14px,#F2B705 14px 20px,#2F5FA7 20px 27px,#3E5B45 27px 36px,#E8601C 36px 42px,#2B1E2F 42px 46px,#C4552D 46px 58px,#FBF6EE 58px 61px)}
.pad{padding:0 20px}
h1.big{margin:0;font:800 32px/1.05 var(--serif)}
h2{margin:0;font:700 21px var(--serif)}
.eyebrow{margin:0;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--tierra)}
.muted{color:var(--muted)}
.view{padding-top:calc(env(safe-area-inset-top) + 18px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;min-height:48px}
.round{width:44px;height:44px;border-radius:50%;border:0;background:var(--cal);display:flex;align-items:center;justify-content:center;flex:none;text-decoration:none}
.avs{display:flex}
.av{width:38px;height:38px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;border:3px solid var(--adobe)}
.av+.av{margin-left:-10px}
.av.m{background:var(--cerro)}.av.j{background:var(--magenta)}
.av.me{box-shadow:0 0 0 2px var(--noche)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 16px;border-radius:999px;border:0;background:var(--cal);font-weight:700;font-size:14px;color:var(--muted)}
.tab.on{background:var(--noche);color:var(--cal);font-weight:800}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:999px;background:var(--arcilla);height:48px}
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{border:0;border-radius:999px;background:transparent;font-weight:800;font-size:15px;color:var(--ink2)}
.seg button.on{background:var(--cerro);color:#fff}
.seg button.on.j{background:var(--magenta)}
.seg button.on.dk{background:var(--noche);color:var(--cal)}
/* carousel */
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 8px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.card{flex:none;width:76%;max-width:300px;height:330px;border-radius:30px;overflow:hidden;position:relative;scroll-snap-align:start;text-decoration:none;color:var(--cal);background:var(--rosa);border:0;padding:0;text-align:left}
.card img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,30,47,.25),rgba(43,30,47,0) 30%,rgba(43,30,47,0) 55%,rgba(43,30,47,.55))}
.card .chip{position:absolute;left:14px;top:22px;padding:5px 11px;border-radius:14px;background:rgba(251,246,238,.92);color:var(--tierra);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.card .fav{position:absolute;right:14px;top:18px;width:40px;height:40px;border-radius:50%;background:rgba(251,246,238,.92);display:flex;align-items:center;justify-content:center}
.card .foot{position:absolute;left:12px;right:12px;bottom:12px;padding:12px 16px;border-radius:20px;background:rgba(43,30,47,.8);display:flex;flex-direction:column;gap:3px}
.card .foot b{font:700 22px/1.1 var(--serif)}
.card .foot span{font-size:13px;color:var(--arcilla)}
.card .agy{position:absolute;left:0;right:0;top:0;height:8px}
.card.done .foot{background:rgba(45,69,51,.88)}
/* mini */
.mini{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;padding:8px;border-radius:22px;background:var(--cal);box-shadow:0 6px 14px rgba(140,59,34,.10);text-decoration:none;color:var(--noche);border:0;text-align:left;width:100%}
.mini .art{width:56px;height:56px;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.mini b{display:block;font:700 15px/1.15 var(--serif)}
.mini span span{font-size:12px;color:var(--muted)}
.next{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:24px;background:var(--noche);color:var(--cal);text-decoration:none;border:0;width:100%;text-align:left}
.next img{width:64px;height:64px;border-radius:18px;object-fit:cover;flex:none;box-shadow:0 0 0 3px var(--cal)}
/* timeline */
.prog{padding:12px 16px;border-radius:22px;background:var(--noche);color:var(--cal);display:flex;flex-direction:column;gap:8px}
.prog .bar{height:8px;border-radius:4px;background:rgba(251,246,238,.18);overflow:hidden}
.prog .bar div{height:8px}
.tl{position:relative;display:flex;flex-direction:column;gap:6px;padding:0 20px}
.tl:before{content:"";position:absolute;left:87.5px;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--line)}
.row{display:grid;grid-template-columns:44px 30px minmax(0,1fr);gap:10px;align-items:center;position:relative}
.row .t{margin:0;font-weight:800;font-size:14px;color:var(--tierra)}
.dot{width:30px;height:30px;border-radius:50%;background:var(--cerro);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:3px solid var(--adobe);position:relative;z-index:1}
.dot.ok{background:var(--puerta)}
.dot.ic{background:var(--cal);border:2.5px solid var(--line);color:var(--muted)}
.dot.now{box-shadow:0 0 0 3px var(--cerro)}
.c{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 8px;border-radius:18px;background:var(--cal);box-shadow:0 4px 10px rgba(140,59,34,.08);min-height:50px;color:var(--noche);text-decoration:none;border:0;text-align:left;width:100%}
.c .th{flex:none;width:40px;height:40px;border-radius:12px;object-fit:cover;box-shadow:0 0 0 2px #fff}
.c .tx{flex:1;min-width:0;padding-left:4px}
.c b{display:block;font:700 16px/1.15 var(--serif)}
.c small{display:block;font-size:12.5px;line-height:1.3;color:var(--muted)}
.c.now{background:#fff;box-shadow:0 0 0 2px var(--cerro),0 8px 18px rgba(196,85,45,.22)}
.c.flat{background:transparent;box-shadow:none;min-height:34px;padding-left:4px}
.c.flat b{font:700 14px var(--sans);color:var(--muted)}
.chk{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.chk.ok{border:0;background:var(--puerta)}
.done .c b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--puerta)}
/* parada */
.hero{position:relative;height:360px;background:var(--tierra);overflow:hidden}
.hero img.ph{width:100%;height:100%;object-fit:cover}
.hero .st{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--rosa)}
.hero .st img{width:62%;transform:rotate(-6deg);filter:drop-shadow(0 8px 12px rgba(43,30,47,.3))}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,30,47,.45),rgba(43,30,47,0) 35%)}
.hero .navb{position:absolute;left:20px;right:20px;top:calc(env(safe-area-inset-top) + 18px);display:flex;justify-content:space-between}
.hero .navb .round{background:rgba(251,246,238,.94)}
.sheet{position:relative;margin-top:-40px;border-radius:32px 32px 0 0;background:var(--adobe);overflow:hidden}
.sheet .in{padding:20px 24px 24px;display:flex;flex-direction:column;gap:12px}
.badge{padding:4px 10px;border-radius:12px;font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;flex:none}
.b-e{background:#F9DCD3;color:var(--tierra)}.b-s{background:#FBE7A6;color:#6B4A0E}.b-m{background:#DCE6DD;color:var(--puerta2)}.b-c{background:#D9E4F4;color:#1F3F75}
.ch{padding:7px 12px;border-radius:14px;background:var(--cal);font-weight:700;font-size:13px;color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--arcilla)}
.btn{height:54px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:16px;text-decoration:none;border:0;padding:0 18px}
.btn.out{box-shadow:inset 0 0 0 2px var(--noche);background:transparent;color:var(--noche)}
.btn.pri{background:var(--cerro);color:#fff}
.btn.ok{background:var(--puerta);color:#fff}
.btn.sm{height:44px;font-size:14px}
.lems{display:flex;gap:0;align-items:center}
/* votar */
.pl{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--cal);font-weight:700;font-size:14px;color:var(--ink2);border:0}
.pl img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.pl.on{background:var(--noche);color:var(--cal)}
.pl .ck{width:16px;height:16px;border-radius:50%;background:var(--puerta);display:flex;align-items:center;justify-content:center}
.vcard{border-radius:28px;background:var(--cal);box-shadow:0 8px 20px rgba(140,59,34,.12);overflow:hidden}
.vcard .in{padding:14px 18px 16px;display:flex;flex-direction:column;gap:6px}
.cr{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:center;gap:4px;min-height:46px;border-top:1px solid #EADBC6}
.cr span{font-weight:700;font-size:14px}
.lm{width:44px;height:44px;border:0;background:none;padding:0;border-radius:12px;display:flex;align-items:center;justify-content:center}
.lm:focus-visible{outline:2px solid var(--azul)}
.lm.off svg{filter:grayscale(1);opacity:.38}
input.note,textarea.note{width:100%;min-height:44px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--arcilla);background:var(--adobe);font:500 16px var(--sans);color:var(--noche)}
textarea.note{min-height:70px;resize:vertical}
/* ranking */
.pod{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;min-height:250px}
.pod .p{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.pod .p img{border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 6px 14px rgba(43,30,47,.25)}
.pod .p p{margin:0;font:700 15px/1.1 var(--serif);text-align:center}
.pod .blk{width:100%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:2px;color:var(--cal);position:relative;overflow:hidden}
.pod .blk b{font:800 28px var(--serif)}
.pod .blk span{font-weight:700;font-size:13px}
.rw{display:grid;grid-template-columns:28px 44px minmax(0,1fr) 48px;gap:10px;align-items:center;padding:10px 14px;border-radius:20px;background:var(--cal)}
.rw img{width:44px;height:44px;border-radius:14px;object-fit:cover}
.bar2{display:grid;grid-template-columns:36px minmax(0,1fr) 26px;gap:6px;align-items:center;font-weight:700;font-size:11.5px;color:var(--muted)}
.bar2 i{display:block;height:7px;border-radius:4px;background:#EADBC6;overflow:hidden}
.bar2 i b{display:block;height:100%;border-radius:4px}
.empty{padding:26px 20px;border-radius:24px;background:var(--cal);text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
/* mapa */
.mapwrap{position:relative;width:100%;overflow:hidden;background:#F5ECDD;border-radius:0 0 28px 28px}
.mapin{position:relative;width:390px;height:560px;transform-origin:0 0}
.mapin>img{position:absolute;left:-110px;top:0;width:620px;height:595px;max-width:none}
.pin{position:absolute;width:30px;height:30px;margin:-34px 0 0 -15px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--cerro);box-shadow:0 3px 6px rgba(43,30,47,.35);border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;padding:0}
.pin b{transform:rotate(45deg);color:#fff;font-weight:800;font-size:12.5px}
.pin.dom{background:var(--puerta)}
.pin.dim{opacity:.35}
.edge{position:absolute;padding:6px 11px;border-radius:999px;background:var(--cal);font-weight:800;font-size:12.5px;box-shadow:0 4px 10px rgba(43,30,47,.18);border:0}
.it{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:52px;text-decoration:none;color:var(--noche);border-bottom:1px solid #EADBC6;padding:4px 0}
.it i{width:34px;height:34px;border-radius:50%;background:var(--cerro);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;font-style:normal}
.it i.dom{background:var(--puerta)}
.it b{font:700 16px var(--serif)}
/* datos */
.tk{border-radius:26px;background:var(--cal);box-shadow:0 8px 20px rgba(140,59,34,.12);overflow:hidden}
.leg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.leg .code{font:800 30px/1 var(--serif)}
.leg small{display:block;font-weight:700;font-size:12px;color:var(--muted)}
.tip{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center}
.tip i{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-style:normal}
.tip b{display:block;font:700 16px var(--serif)}
.tip span{display:block;font-size:14px;line-height:1.35;color:var(--ink2)}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 36px);max-width:444px;bottom:calc(env(safe-area-inset-bottom) + 16px);height:66px;border-radius:33px;background:rgba(43,30,47,.7);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:space-around;padding:0 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.08),0 10px 30px rgba(43,30,47,.28);z-index:20}
.nav button{display:flex;align-items:center;justify-content:center;gap:6px;height:46px;min-width:46px;border-radius:23px;color:var(--adobe);border:0;background:transparent;font-weight:800;font-size:14px;padding:0 10px}
.nav button.on{background:linear-gradient(180deg,rgba(222,112,70,.95),rgba(196,85,45,.85));color:#fff;padding:0 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(140,59,34,.4),0 4px 12px rgba(196,85,45,.35)}
.nav button .lb{display:none}
.nav button.on .lb{display:inline}
.status{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);padding:8px 14px;border-radius:999px;background:var(--puerta2);color:#fff;font-weight:800;font-size:13px;z-index:30;box-shadow:0 6px 14px rgba(43,30,47,.25)}
/* bienvenida */
.wel{position:relative;min-height:100vh;display:flex;flex-direction:column}
.wel .ph{position:relative;height:58vh;min-height:360px;overflow:hidden}
.wel .ph img{width:100%;height:100%;object-fit:cover}
.wel .sheet .in{gap:14px;padding:24px 26px 34px}
.stack{display:flex;flex-direction:column;gap:12px}
.mt{margin-top:18px}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:#2B1E2F;color:#FBF6EE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .45s ease,transform .45s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .sp-a{position:absolute;left:0;right:0;height:14px}
#splash .sp-a.t{top:0;transform-origin:left;animation:spBar .9s cubic-bezier(.2,.8,.2,1) both}
#splash .sp-a.b{bottom:0;transform-origin:right;animation:spBar .9s .1s cubic-bezier(.2,.8,.2,1) both}
#splash .sp-art{position:relative;width:230px;height:230px;display:flex;align-items:center;justify-content:center}
#splash .sp-fl{position:absolute;inset:0;animation:spFl 1.1s cubic-bezier(.2,.9,.25,1.2) both}
#splash .sp-fl svg{width:100%;height:100%;animation:spSpin 14s linear infinite}
#splash .sp-lem{position:relative;animation:spPop .7s .45s cubic-bezier(.3,1.6,.5,1) both;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
#splash .sp-st{position:absolute;right:-6px;top:6px;width:54px;height:54px;animation:spPop .6s .7s cubic-bezier(.3,1.6,.5,1) both}
#splash h1{margin:0;font:800 56px/1 var(--serif);letter-spacing:-.5px;animation:spUp .7s .55s ease both}
#splash p{margin:-12px 0 0;font-weight:800;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:#F2B705;animation:spUp .7s .7s ease both}
#splash .sp-hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 34px);font-size:12px;letter-spacing:.2em;color:rgba(232,210,184,.6);margin:0;animation:spUp .6s 1.1s ease both}
@keyframes spBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes spFl{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spPop{from{transform:scale(0) rotate(-25deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes spUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="lmB" cx=".38" cy=".34" r=".75"><stop offset="0" stop-color="#FFF07A"/><stop offset=".45" stop-color="#FFD21F"/><stop offset="1" stop-color="#E9A800"/></radialGradient></defs></svg>

function vVotar(){
  const voter=ui.voter||me||'a', c=ui.voteCat;
  if(!PLACES[c].includes(ui.votePlace))ui.votePlace=PLACES[c][0];
  const pid=ui.votePlace, s=stop(pid), mine=data[voter].votes[pid]||{}, av=avgOf(voter,pid), ot=avgOf(other(voter),pid);
  const chips=PLACES[c].map(id=>{const x=stop(id);const v=avgOf(voter,id)!=null;return '<button class="pl'+(id===pid?' on':'')+'" data-vp="'+id+'">'+(photo(id)?'<img src="'+photo(id)+'" alt="">':'<span style="width:28px;height:28px;border-radius:50%;background:var(--arcilla)"></span>')+esc(x.name)+(v?'<span class="ck">'+ic('check',10,'#fff',4)+'</span>':'')+'</button>'}).join('');
  const crit=CRIT[c].map(([k,l])=>'<div class="cr"><span>'+l+'</span><div style="display:flex">'+[1,2,3,4,5].map(i=>'<button class="lm'+(i<=(mine[k]||0)?'':' off')+'" data-lm="'+k+'" data-v="'+i+'" aria-label="'+l+': '+i+' de 5" aria-pressed="'+(i<=(mine[k]||0))+'">'+lemon(36)+'</button>').join('')+'</div></div>').join('');
  return '<div class="view">'+header('El jurado','<button class="tab" style="background:var(--cal);color:var(--azul);font-weight:800;display:flex;align-items:center;gap:4px;height:40px" data-go="ranking">Ranking'+ic('fwd',16,'currentColor',2.4)+'</button>')+
  '<div class="pad mt"><div class="seg"><button class="'+(voter==='a'?'on':'')+'" data-voter="a" aria-pressed="'+(voter==='a')+'">Vota Manu</button><button class="'+(voter==='b'?'on j':'')+'" data-voter="b" aria-pressed="'+(voter==='b')+'">Vota Juli</button></div></div>'+
  '<div class="tabs" style="margin-top:12px">'+['e','s','m'].map(k=>'<button class="tab'+(c===k?' on':'')+'" data-vc="'+k+'">'+CATN[k]+'</button>').join('')+'</div>'+
  '<div class="tabs" style="margin-top:10px">'+chips+'</div>'+
  '<div class="pad" style="margin-top:14px"><div class="vcard"><div class="agy" style="height:7px"></div><div class="in">'+
  '<div style="display:flex;align-items:center;gap:12px;padding-bottom:6px"><div style="width:58px;height:58px;border-radius:18px;flex:none;overflow:hidden;box-shadow:0 0 0 3px #fff,0 4px 10px rgba(43,30,47,.2);background:var(--arcilla)">'+(photo(pid)?'<img src="'+photo(pid)+'" alt="" style="width:100%;height:100%;object-fit:cover">':'')+'</div><div style="flex:1;min-width:0"><p style="margin:0;font:700 21px var(--serif)">'+esc(s.name)+'</p><p style="margin:0;font-size:13px;color:var(--muted)">'+CATW[c]+(s.t?' · '+(s.day==='sab'?'sábado':'domingo')+' '+s.t:'')+'</p></div><div style="text-align:right"><p style="margin:0;font:800 26px var(--serif);color:var(--tierra)">'+fmt(av)+'</p><p style="margin:0;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">nota de '+nameOf(voter)+'</p></div></div>'+
  crit+
  '<label for="nota" style="margin-top:6px;font-size:13px;font-weight:800;color:var(--muted)">Nota rápida</label><input id="nota" class="note" maxlength="140" placeholder="Qué pediste, qué te gustó" value="'+esc(data[voter].notes[pid]||'')+'">'+
  '</div></div>'+
  '<p style="margin:14px 2px 0;font-size:14px;color:var(--ink2)">'+(ot==null?nameOf(other(voter))+' todavía no votó este lugar':nameOf(other(voter))+' le puso <b>'+fmt(ot)+'</b>'+(data[other(voter)].notes[pid]?' · “'+esc(data[other(voter)].notes[pid])+'”':''))+'</p></div></div>';

function vRanking(){
  const c=ui.rankCat;
  const rows=PLACES[c].map(id=>Object.assign({id},both(id))).filter(r=>r.avg!=null).sort((x,y)=>y.avg-x.avg);
  const tabs='<div class="pad mt"><div class="seg three">'+['e','s','m'].map(k=>'<button class="'+(c===k?'on dk':'')+'" data-rc="'+k+'">'+CATN[k]+'</button>').join('')+'</div></div>';
  let body;
  if(!rows.length){body='<div class="pad mt"><div class="empty">'+lemon(56)+'<p style="margin:0;font:700 19px var(--serif)">Todavía no hay votos</p><p style="margin:0;font-size:14px;color:var(--muted)">Cuando voten algún lugar de '+CATN[c].toLowerCase()+', el podio aparece acá.</p><button class="btn pri sm" data-go="votar">Ir a votar</button></div></div>'}
  else{
    const top=rows.slice(0,3), rest=rows.slice(3);
    const pod=(r,pos,h,sz,bg)=>r?'<div class="p">'+(pos===1?'<span style="padding:4px 10px;border-radius:999px;background:var(--maiz);font-weight:800;font-size:12px">Campeona</span>':'')+(photo(r.id)?'<img src="'+photo(r.id)+'" alt="" style="width:'+sz+'px;height:'+sz+'px">':'')+'<p>'+esc(stop(r.id).name)+'</p><div class="blk" style="height:'+h+'px;background:'+bg+'">'+(pos===1?'<div class="agy" style="position:absolute;left:0;right:0;top:0;height:6px"></div>':'')+'<b>'+pos+'</b><span>'+fmt(r.avg)+'</span></div></div>':'<div></div>';
    const bar=(k,v)=>'<div class="bar2"><span>'+nameOf(k)+'</span><i><b style="width:'+(v?v/5*100:0)+'%;background:'+(k==='a'?'#C4552D':'#D6246E')+'"></b></i><span>'+fmt(v)+'</span></div>';
    body='<div class="pad mt"><div class="pod">'+pod(top[1],2,104,72,'#D98B7E')+pod(top[0],1,138,88,'#C4552D')+pod(top[2],3,82,66,'#6B4A2F')+'</div><div style="height:3px;background:var(--line);border-radius:2px"></div></div>'+
    '<div class="pad stack" style="margin-top:16px">'+rows.map((r,i)=>'<div class="rw"><b style="font:800 20px var(--serif);color:var(--muted)">'+(i+1)+'</b>'+(photo(r.id)?'<img src="'+photo(r.id)+'" alt="">':'<span></span>')+'<div style="display:flex;flex-direction:column;gap:5px;min-width:0"><p style="margin:0;font:700 16px var(--serif)">'+esc(stop(r.id).name)+'</p>'+bar('a',r.a)+bar('b',r.b)+'</div><b style="font:800 22px var(--serif);color:var(--tierra);text-align:right">'+fmt(r.avg)+'</b></div>').join('')+'</div>';
  }
  return '<div class="view">'+header('Ranking','<button class="round" data-go="votar" aria-label="Volver a votar">'+ic('back',20,'#2B1E2F',2.4)+'</button>')+tabs+body+'</div>';
}

  '<div class="pad" style="margin-top:20px"><label for="frase" style="display:block;font:700 19px var(--serif);margin-bottom:8px">La frase del viaje</label><textarea id="frase" class="note" maxlength="160" placeholder="La que nos quede de este finde">'+esc(data.shared.frase||'')+'</textarea>'+
  '<p style="margin:18px 0 0;font-size:13px;color:var(--muted)">Estás como <b>'+(me?nameOf(me):'—')+'</b>. <button class="tab" style="padding:0;background:none;color:var(--azul);font-weight:800;font-size:13px" data-switch>Cambiar</button></p></div></div>';

const NAV=[['inicio','Inicio','home'],['itinerario','Itinerario','cal'],['mapa','Mapa','map'],['votar','Votar',null],['datos','Datos','info']];
function renderNav(){
  const n=document.getElementById('nav');
  if(!me){n.hidden=true;return}
  n.hidden=false;
  const cur=ui.view==='parada'?ui.from:ui.view==='ranking'?'votar':ui.view;
  n.innerHTML=NAV.map(([v,l,i])=>'<button class="'+(cur===v?'on':'')+'" data-go="'+v+'" aria-label="'+l+'"'+(cur===v?' aria-current="page"':'')+'>'+(i?ic(i,22,'currentColor',2):'<svg width="24" height="24" viewBox="-4 -2 76 72" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><g transform="rotate(-32 32 36)"><path d="M6 36C6 33 8 31 10 30C14 20 23 17 31 17S48 20 52 30C54 31 56 33 56 36S54 41 52 42C48 52 39 55 31 55S14 52 10 42C8 41 6 39 6 36Z"/><path d="M50 28C51 19 58 14 66 14C65 22 59 28 50 28Z"/><path d="M50 28C57 23 65 25 69 30C62 34 55 33 50 28Z"/></g></svg>')+'<span class="lb">'+l+'</span></button>').join('');
}
function render(keepScroll){
  const y=window.scrollY;
  const V={inicio:vInicio,itinerario:vItin,parada:vParada,mapa:vMapa,votar:vVotar,ranking:vRanking,datos:vDatos};
  document.getElementById('app').innerHTML=me?V[ui.view]():vWelcome();
  renderNav();fitMap();
  if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0);
}
function fitMap(){const w=document.getElementById('mapwrap'),m=document.getElementById('mapin');if(!w||!m)return;const s=Math.min(w.clientWidth/390,1.25);m.style.transform='scale('+s+')';w.style.height=(560*s)+'px'}
window.addEventListener('resize',fitMap);
function go(v){if(v==='parada')return;ui.view=v;ls('micuman-view',v);render()}
function open(id){ui.from=ui.view==='parada'?ui.from:ui.view;ui.place=id;ui.view='parada';render()}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');if(!t)return;
  const d=t.dataset;
  if(d.soy){me=d.soy;ls('micuman-soy',me);ui.voter=me;ui.view='inicio';render();return}
  if(d.switch!==undefined){me=other(me);ls('micuman-soy',me);ui.voter=me;render(true);return}
  if(d.go){go(d.go);return}
  if(d.open){open(d.open);return}
  if(d.back!==undefined){ui.view=ui.from||'inicio';render();return}
  if(d.cat){ui.cat=d.cat;render(true);return}
  if(d.day){ui.day=d.day;render(true);return}
  if(d.mapday){ui.mapDay=d.mapday;render(true);return}
  if(d.done){const id=d.done;const v=!data.shared.done[id];if(v)data.shared.done[id]=true;else delete data.shared.done[id];sharedPatch.done[id]=v;render(true);change('shared');return}
  if(d.vote){ui.votePlace=d.vote;ui.voteCat=catOf(d.vote);ui.view='votar';render();return}
  if(d.voter){ui.voter=d.voter;render(true);return}
  if(d.vc){ui.voteCat=d.vc;ui.votePlace=PLACES[d.vc][0];render(true);return}
  if(d.vp){ui.votePlace=d.vp;render(true);return}
  if(d.rc){ui.rankCat=d.rc;render(true);return}
  if(d.lm){const k=ui.voter||me,pid=ui.votePlace,n=+d.v;const v=data[k].votes[pid]=data[k].votes[pid]||{};v[d.lm]=v[d.lm]===n?0:n;if(!v[d.lm])delete v[d.lm];if(!Object.keys(v).length)delete data[k].votes[pid];render(true);change(k);return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='nota'){const k=ui.voter||me;if(t.value)data[k].notes[ui.votePlace]=t.value;else delete data[k].notes[ui.votePlace];change(k)}
  else if(t.id==='frase'){data.shared.frase=t.value;sharedPatch.frase=t.value;change('shared')}
});

/* ---------- guardado (Google Apps Script) ---------- */
const API='https://script.google.com/macros/s/AKfycbzUdRUwEpgLhgFls-eew5X2x7xO6QPiVWlhrGWd-eaPPiaZGdsux5SwShq_b1TY5eoF8A/exec';
const IN_GAS=typeof google!=='undefined'&&google.script&&google.script.run;
async function api(fn,args){
  let r;
  if(fn==='getData') r=await fetch(API+'?api=get&t='+Date.now());
  else r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json(); if(j&&j.error)throw new Error(j.error); return j;
}
function call(fn,...args){if(!IN_GAS)return api(fn,args);return new Promise((res,rej)=>{try{google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args)}catch(e){rej(e)}})}
function status(msg,keep){const s=document.getElementById('status');if(!msg){s.hidden=true;return}s.textContent=msg;s.hidden=false;clearTimeout(status._t);if(!keep)status._t=setTimeout(()=>{s.hidden=true},2200)}
function applyServer(d){
  if(!d)return; rev=d.rev;
  for(const k of ['a','b']) if(!dirty.has(k)&&d[k]) data[k]=Object.assign(clone(DEF[k]),d[k]);
  if(!dirty.has('shared')&&d.shared) data.shared=Object.assign(clone(DEF.shared),d.shared);
}
function rerender(){const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))return;render(true)}
function mergePatch(p){sharedPatch.done=Object.assign({},p.done,sharedPatch.done);if(p.frase!==undefined&&sharedPatch.frase===undefined)sharedPatch.frase=p.frase}
function change(k){dirty.add(k);status('Sin guardar…',true);clearTimeout(saveTimer);saveTimer=setTimeout(save,1200)}
async function save(){
  saveTimer=null;
  if(!dirty.size||saving)return;
  saving=true; status('Guardando…',true);
  let d=null, ok=true;
  try{
    for(const k of [...dirty]){
      if(k==='shared'){
        const p=sharedPatch; sharedPatch={done:{}}; dirty.delete('shared');
        try{d=await call('saveShared',p)}catch(e){mergePatch(p);dirty.add('shared');throw e}
      }else{
        dirty.delete(k);
        try{d=await call('saveJuror',k,data[k])}catch(e){dirty.add(k);throw e}
      }
    }
    applyServer(d); retried=false; status('Guardado ✓'); rerender();
  }catch(e){
    ok=false;
    if(!retried){retried=true;status('Reintentando…',true)}
    else status('No se pudo guardar. Revisá la conexión.',true);
  }finally{
    saving=false;
    if(dirty.size&&(ok||retried)){clearTimeout(saveTimer);saveTimer=setTimeout(save,ok?1200:3000)}
  }
}
async function poll(){
  if(dirty.size||saving||document.hidden)return;
  try{const d=await call('getData');if(d&&d.rev!==rev){applyServer(d);rerender()}}catch(e){}
}

/* ---------- presentación ---------- */
(function(){const sp=document.getElementById('splash');if(!sp)return;const t0=Date.now();let gone=false;
function hide(){if(gone)return;gone=true;sp.classList.add('out');setTimeout(()=>sp.remove(),500)}
sp.addEventListener('click',hide);
window.__splashDone=function(){setTimeout(hide,Math.max(0,1900-(Date.now()-t0)))};
setTimeout(hide,4500);})();
/* ---------- arranque ---------- */
me=(SOY==='a'||SOY==='b')?SOY:ls('micuman-soy');if(me!=='a'&&me!=='b')me=null;
if(SOY==='a'||SOY==='b')ls('micuman-soy',SOY);
ui.voter=me;
const lv=ls('micuman-view');if(lv&&['inicio','itinerario','mapa','votar','ranking','datos'].includes(lv))ui.view=lv;
render();

call('getData').then(d=>{applyServer(d);render(true);status('')}).catch(()=>status('No se pudieron cargar los votos. Recargá la página.',true)).finally(()=>window.__splashDone&&__splashDone());
setInterval(poll,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
})();
</script>
